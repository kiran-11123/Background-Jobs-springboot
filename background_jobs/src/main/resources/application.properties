spring.application.name=background_jobs
spring.config.import=optional:file:./.env[.properties],optional:file:./background_jobs/.env[.properties]
server.port = ${SERVER_PORT : 8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=localhost:9092

# Listener
spring.kafka.listener.ack-mode=record

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
#logging.level.org.springframework.kafka=DEBUG
#logging.level.org.apache.kafka.clients.consumer=INFO


# Consumer
spring.kafka.consumer.group-id=job-worker-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.background_jobs.kafka